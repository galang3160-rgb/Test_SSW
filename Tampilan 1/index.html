<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kosakata SSW Kaigo — Nihonggo Gakkou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home-body theme-blue">

  <main class="page-container">
    <header class="hero-header">
      <div class="badge-tag">介護のことば · SSW KAIGO</div>
      <h1 class="hero-title">Kosakata SSW Kaigo</h1>
      <p class="hero-desc">Pilih kategori dan modul pembelajaran untuk mulai melatih dan menguji penguasaan istilah keperawatan.</p>
      
      <!-- Tombol Pemilihan Kategori -->
      <div class="category-switcher" role="tablist" aria-label="Kategori Kaigo">
        <button type="button" class="tab-btn active" data-type="blue" role="tab" aria-selected="true">Kaigo Biru</button>
        <button type="button" class="tab-btn" data-type="pink" role="tab" aria-selected="false">Kaigo Pink</button>
      </div>

      <div class="status-pill">
        <span id="moduleCountText">25 Modul Kaigo Biru Tersedia</span>
      </div>
    </header>

    <!-- Grid Kartu Modul -->
    <section class="module-grid" id="moduleGrid"></section>

    <footer class="main-footer">
      <span>Nihonggo Gakkou · SSW Kaigo Preparation</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
