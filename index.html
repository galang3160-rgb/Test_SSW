<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Belajar — SSW Kaigo</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Zen Kaku Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="center-hub">
    <!-- Header Ringkas -->
    <header class="hub-header">
      <span class="hub-pill">TOKUTEI GINOU · 介護</span>
      <h1 class="hub-title">SSW Kaigo</h1>
      <p class="hub-subtitle">Pilih metode belajar yang ingin kamu gunakan hari ini</p>
    </header>

    <!-- Dua Kartu Pilihan di Tengah -->
    <div class="cards-grid">
      
      <!-- Kartu 1: Latihan SSW -->
      <a href="Tampilan 1/index.html" class="hub-card card-exam">
        <div class="card-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-tag">SIMULASI CBT</span>
          <h2 class="card-heading">Latihan SSW</h2>
          <p class="card-desc">Simulasi try out CBT DAYU</p>
        </div>
        <div class="card-action-bar">
          <span class="action-label">Mulai Latihan</span>
          <span class="arrow-circle">&rarr;</span>
        </div>
      </a>

      <!-- Kartu 2: Flashcard -->
      <a href="Tampilan 2/index.html" class="hub-card card-flashcard">
        <div class="card-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-tag">HAFALAN KOSAKATA</span>
          <h2 class="card-heading">Flashcard</h2>
          <p class="card-desc">Buat hafalan kosakata</p>
        </div>
        <div class="card-action-bar">
          <span class="action-label">Buka Kartu</span>
          <span class="arrow-circle">&rarr;</span>
        </div>
      </a>

    </div>

    <!-- Footer Bersih -->
    <footer class="hub-footer">
      <span>Nihonggo Gakkou · Persiapan Kerja Jepang</span>
    </footer>
  </main>

</body>
</html>
