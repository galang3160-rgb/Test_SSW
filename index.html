<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SSW Kaigo | Portal Belajar</title>
  <meta name="description" content="Latihan try out CBT dan flashcard kosakata untuk persiapan ujian SSW Kaigo.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="center-hub">

    <header class="hub-header">
      <span class="hub-pill">SSW Kaigo <span lang="ja" class="hub-pill-jp">介護</span></span>
      <h1 class="hub-title">Mau latihan apa hari ini?</h1>
      <p class="hub-subtitle">Latihan Kosakata Terlebih Dahulu Saja Lah</p>
    </header>

    <nav class="cards-grid" aria-label="Pilihan metode belajar">

      <a href="Tampilan 2/index.html" class="hub-card card-exam">
        <div class="card-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1"></rect>
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <path d="m9 14 2 2 4-4"></path>
          </svg>
        </div>
        <div class="card-text">
          <h2 class="card-heading">Latihan Soal SSW</h2>
          <p class="card-desc">Try out dengan tampilan CBT DAYU ISO Request</p>
        </div>
        <div class="card-action-bar">
          <span class="action-label">Mulai try out</span>
          <span class="arrow-circle" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </span>
        </div>
      </a>

      <a href="Tampilan 1/index.html" class="hub-card card-flashcard">
        <div class="card-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="7" width="14" height="14" rx="2"></rect>
            <path d="M7 3h12a2 2 0 0 1 2 2v12"></path>
          </svg>
        </div>
        <div class="card-text">
          <h2 class="card-heading">Flashcard Kosakata</h2>
          <p class="card-desc">Latihan kosakata sek sak durunge latihan soal </p>
        </div>
        <div class="card-action-bar">
          <span class="action-label">Buka flashcard</span>
          <span class="arrow-circle" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m13 6 6 6-6 6"></path>
            </svg>
          </span>
        </div>
      </a>

    </nav>

    <footer class="hub-footer">
      <p>Dari Nihonggo Gakkou, untuk persiapan kerja di Jepang</p>
    </footer>
  </main>

</body>
</html>
